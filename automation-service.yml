server:
  port: 8083

spring:
  application:
    name: automation-service

  datasource:
    url: jdbc:mysql://localhost:3306/greenhouse_automation_db?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

external:
  zone:
    base-url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka